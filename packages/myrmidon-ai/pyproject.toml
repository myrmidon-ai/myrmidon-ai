[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myrmidon-ai"
version = "0.0.1"
description = "MYRMIDON - multi-agent collaboration platform (placeholder)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MYRMIDON Team" }]
requires-python = ">=3.9"
keywords = ["myrmidon", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/myrmidon-ai"

[project.scripts]
myrmidon-ai = "myrmidon_ai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myrmidon_ai"]
